<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <title>Shop</title>
</head>
<body>
<section layout:fragment="content" class="container">
  <h2 class="page-title">Shop</h2>

  <form method="get" th:action="@{/products}" class="card p-2 mt-2"
        style="display:flex; gap:10px; align-items:center;">
    <input class="form-control" name="kw" placeholder="Tìm sản phẩm..." th:value="${kw}">
    <button class="btn btn-outline" type="submit">Tìm</button>
  </form>

  <div class="mt-2" style="display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px;">
    <div class="card p-2" th:each="p : ${page.content}">
      <img th:if="${p.image != null and !#strings.isEmpty(p.image)}"
           th:src="${p.image}"
           style="width:100%; height:160px; object-fit:cover; border-radius:14px;">
      <div th:if="${p.image == null or #strings.isEmpty(p.image)}"
           style="width:100%; height:160px; border-radius:14px; background:#f4f4f4;"></div>

      <div style="padding:10px;">
        <div style="font-weight:800;" th:text="${p.name}">Name</div>
        <div class="text-muted" th:text="${p.price}">0</div>
      </div>
    </div>
  </div>

  <div class="mt-2" style="display:flex; gap:8px; align-items:center;">
    <a class="btn btn-outline" th:if="${page.hasPrevious()}"
       th:href="@{/products(page=${page.number-1},size=${page.size},kw=${kw})}">Prev</a>

    <span class="text-muted"
          th:text="${page.totalPages == 0 ? '0/0' : (page.number+1) + ' / ' + page.totalPages}">
      1 / 1
    </span>

    <a class="btn btn-outline" th:if="${page.hasNext()}"
       th:href="@{/products(page=${page.number+1},size=${page.size},kw=${kw})}">Next</a>
  </div>
</section>
</body>
</html>
