<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <title>Product Form</title>
</head>
<body>
<section layout:fragment="content" class="container">
  <h2 class="page-title" th:text="${id != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm'}">Form</h2>

  <div class="card p-3" style="max-width:860px;">
    <div th:if="${product != null and product.image != null and !#strings.isEmpty(product.image)}"
         class="mb-2" style="display:flex; gap:12px; align-items:center;">
      <img th:src="${product.image}" style="width:120px;height:120px;border-radius:18px;object-fit:cover;">
      <div class="text-muted">Ảnh hiện tại</div>
    </div>

    <form method="post" enctype="multipart/form-data"
          th:action="${id != null} ? @{|/admin/products/${id}/edit|} : @{/admin/products/create}"
          th:object="${form}">

      <div class="form-group">
        <label>Tên</label>
        <input class="form-control" th:field="*{name}" placeholder="Tên sản phẩm">
        <div class="field-error" th:errors="*{name}"></div>
      </div>

      <div class="form-group">
        <label>Mô tả</label>
        <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Mô tả..."></textarea>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <div class="form-group">
          <label>Giá</label>
          <input class="form-control" th:field="*{price}" placeholder="0">
          <div class="field-error" th:errors="*{price}"></div>
        </div>

        <div class="form-group">
          <label>Số lượng</label>
          <input class="form-control" th:field="*{quantity}" placeholder="0">
          <div class="field-error" th:errors="*{quantity}"></div>
        </div>
      </div>

      <div class="form-group">
        <label>Ảnh sản phẩm (1 ảnh)</label>
        <input class="form-control" type="file" name="imageFile" accept="image/*">
        <div class="text-muted" style="margin-top:6px;">
          Nếu không chọn ảnh khi sửa, hệ thống giữ ảnh cũ.
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn btn-primary" type="submit">Lưu</button>
        <a class="btn btn-outline" th:href="@{/admin/products}">Huỷ</a>
      </div>
    </form>
  </div>
</section>
</body>
</html>
