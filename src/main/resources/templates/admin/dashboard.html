<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <title>Admin Dashboard</title>
</head>
<body>
<section layout:fragment="content" class="container">
  <h2 class="page-title">Admin Dashboard</h2>

  <div style="display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;">
    <div class="card p-3">
      <div class="text-muted">Users</div>
      <div style="font-size:28px;font-weight:800" th:text="${userCount}">0</div>
    </div>

    <div class="card p-3">
      <div class="text-muted">Products</div>
      <div style="font-size:28px;font-weight:800" th:text="${productCount}">0</div>
    </div>

    <div class="card p-3">
      <div class="text-muted">Inventory Value</div>
      <div style="font-size:28px;font-weight:800" th:text="${totalInventoryValue}">0</div>
    </div>
  </div>

  <div class="mt-3" style="display:flex; gap:10px;">
    <a class="btn btn-primary" th:href="@{/admin/products}">Quản lý sản phẩm</a>
  </div>
</section>
</body>
</html>
