<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
  <div class="container topbar-inner">
    <div class="topbar-left">
      <a class="brand" th:href="@{/}">
        <span class="brand-badge">LT</span>
        <span class="brand-text">LTWEB</span>
      </a>

      <nav class="nav">
        <a class="nav-link" th:href="@{/}">Home</a>

        <!-- USER xem danh sách sản phẩm -->
        <a class="nav-link" th:href="@{/products}">Shop</a>

        <a class="nav-link" th:href="@{/profile}" sec:authorize="isAuthenticated()">Profile</a>

        <!-- ADMIN -->
        <a class="nav-link" th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Admin</a>
        <a class="nav-link" th:href="@{/admin/products}" sec:authorize="hasRole('ADMIN')">Manage Products</a>
      </nav>
    </div>

    <div class="topbar-right" sec:authorize="isAuthenticated()">
      <div class="user-chip">
        <img class="avatar"
             th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images)
                      ? #authentication.principal.images : '/images/avatar-default.png'}"
             alt="avatar">
        <div class="user-meta">
          <div class="user-name" th:text="${#authentication.principal.fullName}">Full Name</div>
          <div class="user-role" th:text="${#authentication.principal.role}">ROLE_USER</div>
        </div>
      </div>

      <form th:action="@{/logout}" method="post" class="logout-form">
        <button class="btn btn-outline" type="submit">Logout</button>
      </form>
    </div>

    <div class="topbar-right" sec:authorize="!isAuthenticated()">
      <a class="btn btn-outline" th:href="@{/auth/login}">Login</a>
      <a class="btn btn-primary" th:href="@{/auth/register}">Register</a>
    </div>
  </div>
</header>
</body>
</html>
