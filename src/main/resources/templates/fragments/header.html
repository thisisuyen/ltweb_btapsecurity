<header th:fragment="header" xmlns:th="http://www.thymeleaf.org" class="topbar">
  <div class="wrap">
    <a th:href="@{/}" class="brand">
      <span class="brand-badge"></span>
      <span>UTEShop</span>
    </a>

    <nav class="nav">
      <a th:href="@{/}">Home</a>
      <a th:if="${#authorization.expression('isAuthenticated()')}" th:href="@{/products}">Products</a>
      <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/admin/users}">Users</a>
      <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/admin/products}">Admin Products</a>
    </nav>

    <div class="account" th:if="${#authorization.expression('isAuthenticated()')}">
      <img class="avatar"
           th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images)
                ? #authentication.principal.images : '/images/avatar-default.png'}"
           alt="Avatar">
      <span th:text="${#authentication.principal.fullName}">Full name</span>
      <span class="pill" th:text="${#authentication.principal.role}">ROLE_USER</span>

      <form th:action="@{/logout}" method="post" style="display:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-secondary btn-sm" type="submit">Logout</button>
      </form>
    </div>

    <div th:unless="${#authorization.expression('isAuthenticated()')}">
      <a class="btn btn-primary btn-sm" th:href="@{/login}">Đăng nhập</a>
    </div>
  </div>
</header>
