<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <title>Đăng ký</title>
</head>
<body>
<main layout:fragment="content">
  <h2>Đăng ký</h2>

  <p th:if="${error}" style="color:red" th:text="${error}"></p>

  <form th:action="@{/register}" th:object="${registerDTO}" method="post">
    <div>
      <label>Username</label>
      <input type="text" th:field="*{username}">
      <div style="color:red" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
    </div>

    <div>
      <label>Email</label>
      <input type="email" th:field="*{email}">
      <div style="color:red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>

    <div>
      <label>Họ tên</label>
      <input type="text" th:field="*{fullName}">
      <div style="color:red" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>

    <div>
      <label>Mật khẩu</label>
      <input type="password" th:field="*{password}">
      <div style="color:red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <div>
      <label>Nhập lại mật khẩu</label>
      <input type="password" th:field="*{confirmPassword}">
      <div style="color:red" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
    </div>

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">Đăng ký</button>
  </form>
</main>
</body>
</html>
