<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <title>Xác thực OTP</title>
</head>
<body>
<main layout:fragment="content">
  <h2>Xác thực OTP</h2>

  <p>Email: <b th:text="${email}"></b></p>

  <p th:if="${param.resent}" style="color:green">Đã gửi lại OTP.</p>
  <p th:if="${error}" style="color:red" th:text="${error}"></p>

  <form th:action="@{/verify-otp}" method="post">
    <input type="hidden" name="email" th:value="${email}">
    <div>
      <label>OTP</label>
      <input type="text" name="code" required>
    </div>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">Xác thực</button>
  </form>

  <form th:action="@{/register/resend-otp}" method="post" style="margin-top:10px;">
    <input type="hidden" name="email" th:value="${email}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">Gửi lại OTP</button>
  </form>
</main>
</body>
</html>
