<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <title>Verify OTP</title>
</head>
<body>
<section layout:fragment="content" class="auth-page">
  <div class="card auth-card">
    <div class="card-body">
      <div class="brand-line">
        <span class="brand-dot"></span>
        <h2 class="m-0">Nhập OTP</h2>
      </div>

      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <form th:action="@{/auth/verify-otp}" method="post" class="form">
        <input type="hidden" name="email" th:value="${email}">

        <div class="form-group">
          <label>Email</label>
          <input class="form-control" th:value="${email}" disabled>
        </div>

        <div class="form-group">
          <label>Mã OTP</label>
          <input class="form-control" name="otp" placeholder="Nhập mã OTP" required>
        </div>

        <button class="btn btn-primary w-100" type="submit">Xác thực</button>
      </form>

      <form th:action="@{/auth/resend-otp}" method="post" class="mt-2">
        <input type="hidden" name="email" th:value="${email}">
        <button class="btn btn-outline w-100" type="submit">Gửi lại OTP</button>
      </form>
    </div>
  </div>
</section>
</body>
</html>
