<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>Quên mật khẩu</title></head>
<body>
<section layout:fragment="content" class="auth-page">
  <div class="card auth-card">
    <div class="card-body">
      <div class="brand-line">
        <span class="brand-dot"></span>
        <h2 class="m-0">Quên mật khẩu</h2>
      </div>

      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <!-- QUAN TRỌNG: action đúng -->
      <form method="post" th:action="@{/auth/forgot-password}" th:object="${form}" class="form">
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" th:field="*{email}" placeholder="Nhập email" required>
          <div class="field-error" th:errors="*{email}"></div>
        </div>

        <button class="btn btn-primary w-100" type="submit">Gửi OTP</button>

        <div class="auth-links">
          <a th:href="@{/auth/login}">Quay lại đăng nhập</a>
        </div>
      </form>
    </div>
  </div>
</section>
</body>
</html>
