<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>Đổi mật khẩu</title></head>
<body>
<section layout:fragment="content" class="auth-page">
  <div class="card auth-card">
    <div class="card-body">
      <div class="brand-line">
        <span class="brand-dot"></span>
        <h2 class="m-0">Đổi mật khẩu</h2>
      </div>

      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <form method="post" th:action="@{/auth/reset-password}" th:object="${form}" class="form">
        <input type="hidden" th:field="*{email}">

        <div class="form-group">
          <label>Email</label>
          <input class="form-control" th:value="*{email}" disabled>
        </div>

        <div class="form-group">
          <label>Mã OTP</label>
          <input class="form-control" th:field="*{otp}" placeholder="Nhập OTP" required>
          <div class="field-error" th:errors="*{otp}"></div>
        </div>

        <div class="form-group">
          <label>Mật khẩu mới</label>
          <input class="form-control" type="password" th:field="*{newPassword}" required>
          <div class="field-error" th:errors="*{newPassword}"></div>
        </div>

        <button class="btn btn-primary w-100" type="submit">Cập nhật</button>

        <div class="auth-links">
          <a th:href="@{/auth/login}">Quay lại đăng nhập</a>
        </div>
      </form>
    </div>
  </div>
</section>
</body>
</html>
