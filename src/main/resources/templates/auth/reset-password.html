<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
  <title>Đặt lại mật khẩu</title>
</head>
<body>
<main layout:fragment="content">
  <h2>Đặt lại mật khẩu</h2>

  <p th:if="${sent}" style="color:green">Đã gửi OTP về email.</p>
  <p th:if="${error}" style="color:red" th:text="${error}"></p>

  <form th:action="@{/reset-password}" th:object="${resetDTO}" method="post">
    <div>
      <label>Email</label>
      <input type="email" th:field="*{email}" readonly>
    </div>

    <div>
      <label>OTP</label>
      <input type="text" th:field="*{code}">
      <div style="color:red" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
    </div>

    <div>
      <label>Mật khẩu mới</label>
      <input type="password" th:field="*{newPassword}">
      <div style="color:red" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
    </div>

    <div>
      <label>Nhập lại mật khẩu</label>
      <input type="password" th:field="*{confirmPassword}">
      <div style="color:red" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
    </div>

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">Đổi mật khẩu</button>
  </form>
</main>
</body>
</html>
